# Mirrors gemini-cli trigger_e2e.yml -- UNPRIVILEGED, runs on fork PRs.
name: 'Trigger Chained'
on:
  pull_request:
jobs:
  save_repo_name:
    runs-on: ubuntu-latest
    steps:
      - name: 'Save Repo name'
        env:
          REPO_NAME: '${{ github.event.pull_request.head.repo.full_name }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |
          mkdir -p ./pr
          echo "${REPO_NAME}" > ./pr/repo_name
          echo "${HEAD_SHA}"  > ./pr/head_sha
          echo "--- artifact contents ---"; cat ./pr/repo_name ./pr/head_sha
      - uses: actions/upload-artifact@v4
        with:
          name: 'repo_name'
          path: 'pr/'
